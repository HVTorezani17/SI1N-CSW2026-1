<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <div class="card">
    <div class="banner banner-idade">
      <div class="banner-inner">
        <span class="banner-title">Calculadora de Idade</span>
      </div>
    </div>

    <div class="form-area">
      <div class="field-row">
        <label>Data de Nascimento</label>
        <input type="number" id="dia" placeholder="Dia" min="1" max="31">
        <select id="mes">
          <option value="1">Janeiro</option>
          <option value="2">Fevereiro</option>
          <option value="3">Março</option>
          <option value="4">Abril</option>
          <option value="5">Maio</option>
          <option value="6">Junho</option>
          <option value="7">Julho</option>
          <option value="8">Agosto</option>
          <option value="9">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>
        <input type="number" id="ano" placeholder="Ano" min="1900" max="2025">
      </div>

      <button class="btn-blue" onclick="calcularIdade()">Calcula Idade</button>
      <div class="result-label" id="resultIdade">Idade</div>
    </div>
  </div>

  <div class="card">
    <div class="banner banner-calc">
      <div class="banner-inner">
        <span class="banner-title">Calculadora</span>
      </div>
    </div>

    <div class="form-area">
      <div class="calc-row">
        <input type="number" id="num1" value="30">
        <select id="operador">
          <option value="*">*</option>
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="/">/</option>
        </select>
        <input type="number" id="num2" value="2">
      </div>

      <button class="btn-blue" onclick="calcular()">Calcula</button>
      <div class="result-label" id="resultCalc"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
